<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Neural 3D</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="app">
  <header><span>NEURAL 3D</span><h1>Red neuronal</h1><p>Una red pequeña. Visible. Interactiva.</p></header>
  <section class="viewer card">
    <div id="scene">
      <div id="network3d">
        <div class="layer inputs"><i>0</i><i>0</i></div>
        <div class="layer hidden"><i>N</i><i>N</i><i>N</i><i>N</i></div>
        <div class="layer outputs"><i>0.000</i></div>
      </div>
      <small>arrastra para girar · rueda para zoom</small>
    </div>
    <div class="actions"><button id="train">Entrenar</button><button id="reset">Reiniciar</button><button id="rotate">Girar</button></div>
    <div class="stats"><label>Épocas <b id="epoch">0</b></label><label>2 → 4 → 1 neuronas</label></div>
  </section>
  <section class="card controls">
    <div><label>Entrada 1<input id="x1" type="number" min="0" max="1" step="1" value="0"></label><label>Entrada 2<input id="x2" type="number" min="0" max="1" step="1" value="0"></label></div>
    <button id="predict">Predecir</button><p>Salida <strong id="prediction">0.000</strong> · <span id="classification">0</span></p>
  </section>
</main><script src="script.js"></script>
</body></html>
